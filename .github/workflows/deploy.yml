name: Deploy to GitHub Pages

on:
  push:
    branches:
      - V.01
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Inspect build output
        run: |
          echo "DIST CONTENTS:"
          if [ ! -d ./dist ]; then
            echo "./dist missing"
            exit 1
          fi
          ls -la ./dist
          file_count=$(find ./dist -type f | wc -l)
          if [ "$file_count" -eq "0" ]; then
            echo "./dist exists but contains no files"
            exit 1
          fi
          du -sh ./dist || true
          find ./dist -maxdepth 2 -type f -print | head -n 50

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Show current Pages deployment status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          echo "Listing latest Pages deployment:"
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/pages/deployment | jq || true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000